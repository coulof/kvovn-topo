# custom-vpc-ovn-nat: a custom VPC with OVN NAT (NB NAT rows), after the
# Kube-OVN v1.16 docs "OVN EIP FIP SNAT". The external network is the lab's
# egress network on egress0 (${EGRESS_CIDR}); the centralized gateway runs on
# ${LAB_NAME}-agent1 (node-labels).
apiVersion: kubeovn.io/v1
kind: ProviderNetwork
metadata:
  name: external
spec:
  defaultInterface: egress0
---
apiVersion: kubeovn.io/v1
kind: Vlan
metadata:
  name: vlan0
spec:
  id: 0
  provider: external
---
# Named "external": the default of kube-ovn-controller --external-gateway-switch.
apiVersion: kubeovn.io/v1
kind: Subnet
metadata:
  name: external
spec:
  protocol: IPv4
  cidrBlock: ${EGRESS_CIDR}
  gateway: ${EGRESS_GATEWAY}
  vlan: vlan0
  excludeIps:
    - ${EGRESS_NET}.1..${EGRESS_NET}.99
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ovn-external-gw-config
  namespace: kube-system
data:
  enable-external-gw: "true"
  external-gw-nodes: ${LAB_NAME}-agent1
  type: centralized
  external-gw-nic: egress0
  external-gw-addr: ${EGRESS_GW_CIDR}
---
apiVersion: v1
kind: Namespace
metadata:
  name: vpc-a
---
apiVersion: kubeovn.io/v1
kind: Vpc
metadata:
  name: vpc-a
spec:
  namespaces: [vpc-a]
  enableExternal: true
  staticRoutes:
    - cidr: 0.0.0.0/0
      nextHopIP: ${EGRESS_GATEWAY}
      policy: policyDst
---
apiVersion: kubeovn.io/v1
kind: Subnet
metadata:
  name: vpc-a-net
spec:
  vpc: vpc-a
  protocol: IPv4
  cidrBlock: 10.10.0.0/24
  gateway: 10.10.0.1
  namespaces: [vpc-a]
---
apiVersion: v1
kind: Pod
metadata:
  name: web-1
  namespace: vpc-a
  annotations:
    ovn.kubernetes.io/logical_switch: vpc-a-net   # not ovn-default if the namespace binding is late
spec:
  nodeSelector: {kubernetes.io/hostname: "${LAB_NAME}-agent1"}
  containers:
    - name: web
      image: docker.io/library/nginx:1.27-alpine
---
apiVersion: v1
kind: Pod
metadata:
  name: web-2
  namespace: vpc-a
  annotations:
    ovn.kubernetes.io/logical_switch: vpc-a-net   # not ovn-default if the namespace binding is late
spec:
  nodeSelector: {kubernetes.io/hostname: "${LAB_NAME}-agent2"}
  containers:
    - name: web
      image: docker.io/library/nginx:1.27-alpine
---
# Distributed FIP on web-1: an NB dnat_and_snat row with logical_port set.
apiVersion: kubeovn.io/v1
kind: OvnEip
metadata:
  name: eip-fip-web1
spec:
  externalSubnet: external
  type: nat
---
apiVersion: kubeovn.io/v1
kind: OvnFip
metadata:
  name: fip-web1
spec:
  ovnEip: eip-fip-web1
  ipName: web-1.vpc-a
  type: distributed
---
# SNAT for the whole subnet: an NB snat row.
apiVersion: kubeovn.io/v1
kind: OvnEip
metadata:
  name: eip-snat-vpc-a
spec:
  externalSubnet: external
  type: nat
---
apiVersion: kubeovn.io/v1
kind: OvnSnatRule
metadata:
  name: snat-vpc-a-net
spec:
  ovnEip: eip-snat-vpc-a
  vpcSubnet: vpc-a-net

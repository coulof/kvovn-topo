# vpc-nat-gw-asym: the ADR-0004 asymmetric return. vpc-c has two VPC NAT
# gateways: gw-out (lanIp .254) takes the default route and SNATs the subnet;
# gw-in (lanIp .253) DNATs to web. Replies to gw-in's DNAT follow 0.0.0.0/0 to
# gw-out and bypass gw-in, whose conntrack never sees them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ovn-vpc-nat-config
  namespace: kube-system
data:
  image: docker.io/kubeovn/vpc-nat-gateway:${KUBE_OVN_VERSION}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ovn-vpc-nat-gw-config
  namespace: kube-system
data:
  enable-vpc-nat-gw: "true"
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ovn-vpc-external-network
  namespace: kube-system
spec:
  config: '{
      "cniVersion": "0.3.0",
      "type": "macvlan",
      "master": "egress0",
      "mode": "bridge",
      "ipam": {
        "type": "kube-ovn",
        "server_socket": "/run/openvswitch/kube-ovn-daemon.sock",
        "provider": "ovn-vpc-external-network.kube-system"
      }
    }'
---
apiVersion: kubeovn.io/v1
kind: Subnet
metadata:
  name: ovn-vpc-external-network
spec:
  protocol: IPv4
  provider: ovn-vpc-external-network.kube-system
  cidrBlock: ${EGRESS_CIDR}
  gateway: ${EGRESS_GATEWAY}
  excludeIps:
    - ${EGRESS_NET}.1..${EGRESS_NET}.199
---
apiVersion: v1
kind: Namespace
metadata:
  name: vpc-c
---
apiVersion: kubeovn.io/v1
kind: Vpc
metadata:
  name: vpc-c
spec:
  namespaces: [vpc-c]
  staticRoutes:
    - cidr: 0.0.0.0/0
      nextHopIP: 10.30.0.254   # gw-out; nothing routes back to gw-in
      policy: policyDst
---
apiVersion: kubeovn.io/v1
kind: Subnet
metadata:
  name: vpc-c-net
spec:
  vpc: vpc-c
  protocol: IPv4
  cidrBlock: 10.30.0.0/24
  gateway: 10.30.0.1
  namespaces: [vpc-c]
---
apiVersion: kubeovn.io/v1
kind: VpcNatGateway
metadata:
  name: gw-out
spec:
  vpc: vpc-c
  subnet: vpc-c-net
  lanIp: 10.30.0.254
  selector:
    - "kubernetes.io/hostname: ${LAB_NAME}-agent1"
  externalSubnets:
    - ovn-vpc-external-network
---
apiVersion: kubeovn.io/v1
kind: VpcNatGateway
metadata:
  name: gw-in
spec:
  vpc: vpc-c
  subnet: vpc-c-net
  lanIp: 10.30.0.253
  selector:
    - "kubernetes.io/hostname: ${LAB_NAME}-agent2"
  externalSubnets:
    - ovn-vpc-external-network
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: vpc-c
  annotations:
    ovn.kubernetes.io/logical_switch: vpc-c-net
    ovn.kubernetes.io/ip_address: 10.30.0.10
spec:
  nodeSelector: {kubernetes.io/hostname: "${LAB_NAME}-agent1"}
  containers:
    - name: web
      image: docker.io/library/nginx:1.27-alpine
---
apiVersion: kubeovn.io/v1
kind: IptablesEIP
metadata:
  name: eip-snat-vpc-c
spec:
  natGwDp: gw-out
---
apiVersion: kubeovn.io/v1
kind: IptablesSnatRule
metadata:
  name: snat-vpc-c-net
spec:
  eip: eip-snat-vpc-c
  internalCIDR: 10.30.0.0/24
---
apiVersion: kubeovn.io/v1
kind: IptablesEIP
metadata:
  name: eip-dnat-web-c
spec:
  natGwDp: gw-in
---
apiVersion: kubeovn.io/v1
kind: IptablesDnatRule
metadata:
  name: dnat-web-c
spec:
  eip: eip-dnat-web-c
  externalPort: "8080"
  internalIp: 10.30.0.10
  internalPort: "80"
  protocol: tcp

# vpc-nat-gw: a custom VPC behind an iptables VPC NAT gateway pod, after the
# Kube-OVN v1.16 docs "Config VPC". This NAT never reaches the NB NAT table.
# The VPC sends 0.0.0.0/0 to the gateway's lanIp: the documented, symmetric
# setup (no ADR-0004 asymmetric return).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ovn-vpc-nat-config
  namespace: kube-system
data:
  image: docker.io/kubeovn/vpc-nat-gateway:${KUBE_OVN_VERSION}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ovn-vpc-nat-gw-config
  namespace: kube-system
data:
  enable-vpc-nat-gw: "true"
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ovn-vpc-external-network
  namespace: kube-system
spec:
  config: '{
      "cniVersion": "0.3.0",
      "type": "macvlan",
      "master": "egress0",
      "mode": "bridge",
      "ipam": {
        "type": "kube-ovn",
        "server_socket": "/run/openvswitch/kube-ovn-daemon.sock",
        "provider": "ovn-vpc-external-network.kube-system"
      }
    }'
---
apiVersion: kubeovn.io/v1
kind: Subnet
metadata:
  name: ovn-vpc-external-network
spec:
  protocol: IPv4
  provider: ovn-vpc-external-network.kube-system
  cidrBlock: ${EGRESS_CIDR}
  gateway: ${EGRESS_GATEWAY}
  excludeIps:
    - ${EGRESS_NET}.1..${EGRESS_NET}.199
---
apiVersion: v1
kind: Namespace
metadata:
  name: vpc-b
---
apiVersion: kubeovn.io/v1
kind: Vpc
metadata:
  name: vpc-b
spec:
  namespaces: [vpc-b]
  staticRoutes:
    - cidr: 0.0.0.0/0
      nextHopIP: 10.20.0.254
      policy: policyDst
---
apiVersion: kubeovn.io/v1
kind: Subnet
metadata:
  name: vpc-b-net
spec:
  vpc: vpc-b
  protocol: IPv4
  cidrBlock: 10.20.0.0/24
  gateway: 10.20.0.1
  namespaces: [vpc-b]
---
apiVersion: kubeovn.io/v1
kind: VpcNatGateway
metadata:
  name: gw-b
spec:
  vpc: vpc-b
  subnet: vpc-b-net
  lanIp: 10.20.0.254
  selector:
    - "kubernetes.io/hostname: ${LAB_NAME}-agent2"
  externalSubnets:
    - ovn-vpc-external-network
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: vpc-b
  annotations:
    ovn.kubernetes.io/logical_switch: vpc-b-net
    ovn.kubernetes.io/ip_address: 10.20.0.10
spec:
  nodeSelector: {kubernetes.io/hostname: "${LAB_NAME}-agent1"}
  containers:
    - name: web
      image: docker.io/library/nginx:1.27-alpine
---
apiVersion: kubeovn.io/v1
kind: IptablesEIP
metadata:
  name: eip-dnat-web
spec:
  natGwDp: gw-b
---
apiVersion: kubeovn.io/v1
kind: IptablesDnatRule
metadata:
  name: dnat-web
spec:
  eip: eip-dnat-web
  externalPort: "8080"
  internalIp: 10.20.0.10
  internalPort: "80"
  protocol: tcp
---
apiVersion: kubeovn.io/v1
kind: IptablesEIP
metadata:
  name: eip-snat-vpc-b
spec:
  natGwDp: gw-b
---
apiVersion: kubeovn.io/v1
kind: IptablesSnatRule
metadata:
  name: snat-vpc-b-net
spec:
  eip: eip-snat-vpc-b
  internalCIDR: 10.20.0.0/24

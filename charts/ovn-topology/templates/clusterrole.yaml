apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ovn-topology.fullname" . }}
  labels:
    {{- include "ovn-topology.labels" . | nindent 4 }}
rules:
  # Strictly read-only access to nodes, pods, services for workload identity (ADR-0001)
  - apiGroups: [""]
    resources: ["nodes", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["get", "list", "watch"]
  {{- if and .Values.ovn.tls.enabled .Values.ovn.tls.secretName }}
  # Read-only access to OVN TLS secret only
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.ovn.tls.secretName | quote }}]
    verbs: ["get"]
  {{- end }}

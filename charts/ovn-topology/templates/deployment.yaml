apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ovn-topology.fullname" . }}
  labels:
    {{- include "ovn-topology.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ovn-topology.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ovn-topology.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ovn-topology.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: LISTEN_ADDR
              value: ":{{ .Values.service.port }}"
            - name: OVN_NB_ENDPOINTS
              value: {{ .Values.ovn.nbEndpoints | quote }}
            - name: OVN_SB_ENDPOINTS
              value: {{ .Values.ovn.sbEndpoints | quote }}
            {{- if .Values.ovn.tls.enabled }}
            - name: OVN_CERT
              value: "/etc/ovn-tls/tls.crt"
            - name: OVN_KEY
              value: "/etc/ovn-tls/tls.key"
            - name: OVN_CA
              value: "/etc/ovn-tls/ca.crt"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.ovn.tls.enabled }}
          volumeMounts:
            - name: ovn-tls
              mountPath: /etc/ovn-tls
              readOnly: true
          {{- end }}
      {{- if .Values.ovn.tls.enabled }}
      volumes:
        - name: ovn-tls
          secret:
            secretName: {{ .Values.ovn.tls.secretName | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

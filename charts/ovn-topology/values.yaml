# Default values for ovn-topology chart.

image:
  repository: ghcr.io/coulof/ovn-topologyd
  pullPolicy: IfNotPresent
  tag: "v0.1.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "ovn-topologyd"

ovn:
  # OVN Northbound OVSDB connection endpoints
  nbEndpoints: "tcp:ovn-nb.kube-system.svc.cluster.local:6641"
  # OVN Southbound OVSDB connection endpoints
  sbEndpoints: "tcp:ovn-sb.kube-system.svc.cluster.local:6642"
  # Optional TLS certificate configuration
  tls:
    enabled: false
    # Secret in the release namespace containing tls.crt, tls.key, and ca.crt
    secretName: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

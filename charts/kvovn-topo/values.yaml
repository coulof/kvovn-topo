# Default values for kvovn-topo chart.

image:
  repository: ghcr.io/coulof/kvovn-topod
  pullPolicy: IfNotPresent
  # Empty: the chart's appVersion (set from the release tag), e.g. 0.1.0.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "kvovn-topod"

ovn:
  # OVN Northbound OVSDB connection endpoints
  nbEndpoints: "tcp:ovn-nb.kube-system.svc.cluster.local:6641"
  # OVN Southbound OVSDB connection endpoints
  sbEndpoints: "tcp:ovn-sb.kube-system.svc.cluster.local:6642"
  # Optional TLS certificate configuration
  tls:
    enabled: false
    # Secret in the release namespace containing tls.crt, tls.key, and ca.crt
    secretName: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# The API is reached only through the Kubernetes service proxy, which enforces
# authentication and RBAC; the daemon has no authentication of its own. Keep
# ClusterIP: a NodePort, LoadBalancer (e.g. Harvester/kube-vip IP pool) or bare
# Ingress would expose the topology unauthenticated.
service:
  type: ClusterIP
  port: 8080

rbac:
  viewer:
    # Create a Role "<fullname>-viewer" (get services/proxy and the Service)
    # for users of kvovn-topo / kvovn-topo mcp. No bindings are created.
    create: false
    # Also create a ClusterRole "<fullname>-discovery" (list services) so
    # kvovn-topo can find the Service outside kube-system without flags.
    discovery: true

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

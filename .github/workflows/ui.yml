name: UI CI

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'api/openapi.yaml'
      - '.github/workflows/ui.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ui/**'
      - 'api/openapi.yaml'
      - '.github/workflows/ui.yml'
  workflow_dispatch:

jobs:
  build-and-test-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: ui/yarn.lock

      - name: Install dependencies
        run: yarn install

      - name: Run ESLint
        run: yarn lint

      - name: Run Unit Tests
        run: yarn test

      - name: Build Extension Package
        run: yarn build-pkg ovn-topology

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write
  packages: write

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      prerelease: ${{ steps.get_version.outputs.prerelease }}
    steps:
      - name: Determine version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # A SemVer pre-release (e.g. 0.1.0-dev) does not move :latest and is marked as a pre-release.
          case "${VERSION}" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  build-binaries:
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile multi-arch binaries
        env:
          VERSION: ${{ needs.prepare-version.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-w -s -X main.version=${VERSION} -X main.gitCommit=${GIT_COMMIT} -X main.buildDate=${DATE}"

          # Supported targets: linux/amd64, darwin/arm64, windows/amd64.
          for TARGET in linux/amd64 darwin/arm64; do
            OS=${TARGET%/*} ARCH=${TARGET#*/}
            echo "Building for ${OS}/${ARCH}..."
            CGO_ENABLED=0 GOOS=${OS} GOARCH=${ARCH} go build -ldflags="${LDFLAGS}" -o dist/kvovn-topod_${OS}_${ARCH} ./cmd/kvovn-topod
            CGO_ENABLED=0 GOOS=${OS} GOARCH=${ARCH} go build -ldflags="${LDFLAGS}" -o dist/kvovn-topo_${OS}_${ARCH} ./cmd/kvovn-topo

            tar -czf dist/kvovn-topo_${VERSION}_${OS}_${ARCH}.tar.gz -C dist kvovn-topod_${OS}_${ARCH} kvovn-topo_${OS}_${ARCH}
          done

          # Windows: the TUI only (the daemon targets in-cluster Linux).
          echo "Building kvovn-topo for windows/amd64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/kvovn-topo.exe ./cmd/kvovn-topo
          (cd dist && zip -q kvovn-topo_${VERSION}_windows_amd64.zip kvovn-topo.exe && rm kvovn-topo.exe)

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            dist/*.tar.gz
            dist/*.zip

  build-and-push-image:
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push daemon image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kvovn-topod:${{ needs.prepare-version.outputs.version }}
            ${{ needs.prepare-version.outputs.prerelease == 'false' && format('ghcr.io/{0}/kvovn-topod:latest', github.repository_owner) || '' }}
          build-args: |
            VERSION=${{ needs.prepare-version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}

  package-and-push-chart:
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Package chart
        env:
          VERSION: ${{ needs.prepare-version.outputs.version }}
        run: |
          mkdir -p chart-dist
          sed -i "s/^version:.*/version: ${VERSION}/" charts/kvovn-topo/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/kvovn-topo/Chart.yaml
          helm package charts/kvovn-topo -d chart-dist/

      - name: Push chart to GHCR OCI
        env:
          HELM_EXPERIMENTAL_OCI: 1
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push chart-dist/kvovn-topo-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: chart-dist/*.tgz

  create-release:
    needs: [prepare-version, build-binaries, build-and-push-image, package-and-push-chart]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Only our artifacts: build-push-action also uploads a *.dockerbuild record, which fails to download.
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '{binaries,helm-chart}'
          path: release-assets/
          merge-multiple: true

      - name: Generate Hauler manifest
        env:
          VERSION: ${{ needs.prepare-version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cat << EOF > release-assets/hauler.yaml
          apiVersion: content.hauler.cattle.io/v1alpha1
          kind: Content
          metadata:
            name: kvovn-topo-airgap-bundle
          spec:
            images:
              - name: ghcr.io/${OWNER}/kvovn-topod:${VERSION}
            charts:
              - name: kvovn-topo
                repo: oci://ghcr.io/${OWNER}/charts
                version: ${VERSION}
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-version.outputs.version }}
          name: Release v${{ needs.prepare-version.outputs.version }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.tgz
            release-assets/hauler.yaml
          prerelease: ${{ needs.prepare-version.outputs.prerelease == 'true' }}
          generate_release_notes: true

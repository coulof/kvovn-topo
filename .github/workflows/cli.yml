name: CLI (macOS & Windows)

# Builds and tests the kvovn-topo TUI natively on macOS and Windows, and uploads
# the binaries (darwin/arm64, windows/amd64) as workflow artifacts. Linux is covered by go.yml.

on:
  push:
    paths:
      - 'cmd/kvovn-topo/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/cli.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cmd/kvovn-topo/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test TUI
        run: go test ./cmd/kvovn-topo

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          LDFLAGS="-w -s -X main.version=dev-${GITHUB_SHA::7} -X main.gitCommit=${GITHUB_SHA} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags="${LDFLAGS}" -o dist/kvovn-topo_${GOOS}_${GOARCH}${{ matrix.ext }} ./cmd/kvovn-topo

      - name: Smoke test native binary
        run: |
          BIN=dist/kvovn-topo_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}
          "$BIN" --fixture --view l3 -o json > /dev/null

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: kvovn-topo-${{ matrix.goos }}
          path: dist/*

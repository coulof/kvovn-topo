version: '3'

vars:
  KUBECONFIG: '{{.KUBECONFIG | default "~/.kube/hv-01.yaml"}}'
  NB_PORT: 6641
  SB_PORT: 6642
  DAEMON_PORT: 8080
  DAEMON_URL: 'http://127.0.0.1:{{.DAEMON_PORT}}/api/v1'
  PROXY_POD: 'ovn-topology-proxy'
  PROXY_NAMESPACE: 'kube-system'

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  build:
    desc: Build ovn-topologyd and ovn-topo binaries
    cmds:
      - make build

  pf-proxy-deploy:
    desc: Deploy the lightweight OVN port-forwarding bridge pod into kube-system
    cmds:
      - |
        if ! kubectl --kubeconfig {{.KUBECONFIG}} get pod -n {{.PROXY_NAMESPACE}} {{.PROXY_POD}} > /dev/null 2>&1; then
          echo "Deploying {{.PROXY_POD}} in {{.PROXY_NAMESPACE}}..."
          cat << 'EOF' | kubectl --kubeconfig {{.KUBECONFIG}} apply -f -
        apiVersion: v1
        kind: Pod
        metadata:
          name: {{.PROXY_POD}}
          namespace: {{.PROXY_NAMESPACE}}
          labels:
            app: {{.PROXY_POD}}
        spec:
          containers:
            - name: proxy
              image: docker.io/kubeovn/kube-ovn:v1.16.2
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - -c
                - |
                  import asyncio

                  async def pipe(reader, writer):
                      try:
                          while True:
                              data = await reader.read(65536)
                              if not data:
                                  break
                              writer.write(data)
                              await writer.drain()
                      except Exception:
                          pass
                      finally:
                          writer.close()

                  async def handle_nb(reader, writer):
                      r, w = await asyncio.open_connection("ovn-nb.kube-system.svc.cluster.local", 6641)
                      asyncio.create_task(pipe(reader, w))
                      asyncio.create_task(pipe(r, writer))

                  async def handle_sb(reader, writer):
                      r, w = await asyncio.open_connection("ovn-sb.kube-system.svc.cluster.local", 6642)
                      asyncio.create_task(pipe(reader, w))
                      asyncio.create_task(pipe(r, writer))

                  async def main():
                      s1 = await asyncio.start_server(handle_nb, "0.0.0.0", 6641)
                      s2 = await asyncio.start_server(handle_sb, "0.0.0.0", 6642)
                      async with s1, s2:
                          await asyncio.gather(s1.serve_forever(), s2.serve_forever())

                  asyncio.run(main())
              ports:
                - containerPort: 6641
                - containerPort: 6642
        EOF
          kubectl --kubeconfig {{.KUBECONFIG}} wait --for=condition=Ready pod/{{.PROXY_POD}} -n {{.PROXY_NAMESPACE}} --timeout=30s
        fi

  pf-proxy-remove:
    desc: Delete the OVN port-forwarding bridge pod from kube-system
    cmds:
      - task: port-forward-stop
      - kubectl --kubeconfig {{.KUBECONFIG}} delete pod -n {{.PROXY_NAMESPACE}} {{.PROXY_POD}} --ignore-not-found

  pf:
    desc: Alias for port-forward
    cmds:
      - task: port-forward

  port-forward:
    desc: Start background port-forwarding for ovn-nb (6641) and ovn-sb (6642)
    deps: [pf-proxy-deploy]
    cmds:
      - task: port-forward-stop
      - |
        echo "Starting background port-forward to {{.PROXY_POD}}..."
        nohup kubectl --kubeconfig {{.KUBECONFIG}} port-forward -n {{.PROXY_NAMESPACE}} pod/{{.PROXY_POD}} {{.NB_PORT}}:6641 {{.SB_PORT}}:6642 > /tmp/ovn-pf.log 2>&1 &
        sleep 2
        echo "Port-forward active on 127.0.0.1:{{.NB_PORT}} (NB) and 127.0.0.1:{{.SB_PORT}} (SB)"

  port-forward-stop:
    desc: Stop active port-forwards on OVN ports
    cmds:
      - |
        pkill -f "kubectl.*port-forward.*{{.PROXY_POD}}" || true
        pkill -f "kubectl.*port-forward.*6641" || true
        pkill -f "kubectl.*port-forward.*6642" || true
        echo "Port-forwards stopped."

  daemon:
    desc: Run ovn-topologyd locally against live cluster OVN databases
    deps: [build]
    cmds:
      - |
        ./bin/ovn-topologyd \
          --kubeconfig={{.KUBECONFIG}} \
          --nb-endpoints=tcp:127.0.0.1:{{.NB_PORT}} \
          --sb-endpoints=tcp:127.0.0.1:{{.SB_PORT}} \
          --listen-addr=:{{.DAEMON_PORT}} \
          --log-level=info

  tui:
    desc: Launch interactive Bubble Tea TUI against the running daemon
    deps: [build]
    cmds:
      - ./bin/ovn-topo --daemon-url={{.DAEMON_URL}}

  tui-offline:
    desc: Launch TUI in offline mode using bundled dev fixtures
    deps: [build]
    cmds:
      - ./bin/ovn-topo --fixture

  curl-ready:
    desc: Check daemon readiness
    cmds:
      - curl -s http://127.0.0.1:{{.DAEMON_PORT}}/readyz | jq .

  curl-version:
    desc: Query daemon and OVN schema versions
    cmds:
      - curl -s http://127.0.0.1:{{.DAEMON_PORT}}/version | jq .

  curl-graph:
    desc: Fetch aggregated L3 graph
    cmds:
      - curl -s "{{.DAEMON_URL}}/graph?view=l3" | jq .

  curl-chassis:
    desc: Fetch chassis status list
    cmds:
      - curl -s "{{.DAEMON_URL}}/chassis" | jq .

  curl-events:
    desc: Stream live SSE events
    cmds:
      - curl -N -s "{{.DAEMON_URL}}/events"

  test-live:
    desc: Run end-to-end verification against the running daemon
    cmds:
      - |
        echo "==> Checking /readyz..."
        curl -fsS http://127.0.0.1:{{.DAEMON_PORT}}/readyz | jq .
        echo "==> Checking /version..."
        curl -fsS http://127.0.0.1:{{.DAEMON_PORT}}/version | jq .
        echo "==> Checking /graph?view=l3..."
        curl -fsS "{{.DAEMON_URL}}/graph?view=l3" | jq '{revision: .revision, nodes: (.nodes | length), edges: (.edges | length), vpcs: [.nodes[] | select(.type=="VPC") | .name]}'
        echo "==> Checking /chassis..."
        curl -fsS "{{.DAEMON_URL}}/chassis" | jq '{total_chassis: (.items | length), hostnames: [.items[].hostname]}'
        echo "==> All live tests passed!"

  clean:
    desc: Stop port-forwards and clean build artifacts
    cmds:
      - task: port-forward-stop
      - rm -rf bin/

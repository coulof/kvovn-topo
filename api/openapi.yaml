openapi: 3.0.3
info:
  title: kvovn-topo API
  version: 1.0.0
  description: Read-only network topology API for OVN as deployed by Kube-OVN.
servers:
  - url: /api/v1
    description: Base API path

paths:
  /graph:
    get:
      summary: Get aggregated graph
      description: Returns an aggregated network topology graph for the specified view.
      operationId: getGraph
      parameters:
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum: [l3, l2, chassis]
            default: l3
          description: Graph view type (defaults to l3).
        - name: focus
          in: query
          required: false
          schema:
            type: string
          description: Focus node ID to center on or drill into (e.g. ls:<uuid> in L2 view).
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Hop depth for focus node exploration.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number for paginated nodes (e.g. LSPs in L2 view).
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 50
          description: Page size for paginated nodes (max 200).
        - name: at
          in: query
          required: false
          schema:
            type: string
          description: >-
            A past point (M8, ADR-0002): RFC3339 time, `<epoch>:<revision>`, a bare
            revision of the current epoch, or a negative duration from now (`-1h`).
            The state is reconstructed from history; Kubernetes enrichment is
            current, not historical. Absent or `now`: the live graph.
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: Revision entity tag. Returns 304 if graph has not changed.
      responses:
        '200':
          description: Topology graph snapshot.
          headers:
            ETag:
              schema:
                type: string
              description: Current graph revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphResponse'
        '304':
          description: Not Modified. Graph has not changed since the specified revision.
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The point is outside history coverage (OUT_OF_COVERAGE) or in a gap (IN_GAP).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: History is disabled on this daemon (HISTORY_DISABLED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Daemon is initializing or database monitors not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /node/{id}:
    get:
      summary: Get detailed node info
      description: Returns full details, raw columns, external_ids, and related objects for a single node.
      operationId: getNode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Typed node ID (e.g. lr:<uuid>, ls:<uuid>, chassis:<name>).
        - name: at
          in: query
          required: false
          schema:
            type: string
          description: >-
            A past point (M8, ADR-0002): RFC3339 time, `<epoch>:<revision>`, a bare
            revision of the current epoch, or a negative duration from now (`-1h`).
            The state is reconstructed from history; Kubernetes enrichment is
            current, not historical. Absent or `now`: the live graph.
      responses:
        '200':
          description: Node detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDetail'
        '404':
          description: Node not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The point is outside history coverage (OUT_OF_COVERAGE) or in a gap (IN_GAP).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: History is disabled on this daemon (HISTORY_DISABLED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Daemon not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /chassis:
    get:
      summary: List chassis
      description: Returns all chassis with encaps, binding counts, and gateway roles.
      operationId: getChassis
      responses:
        '200':
          description: List of chassis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChassisList'
        '503':
          description: Daemon not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /find:
    get:
      summary: Search topology objects
      description: >-
        Finds routers, switches, ports and chassis by name, IP, MAC, namespace,
        pod, VM or chassis hostname / encap IP. IP and MAC queries match exactly;
        other queries match case-insensitive substrings. Results are ordered
        (exact matches first, then by type and name) and paginated by offset.
      operationId: findObjects
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Search text (name fragment, IP, MAC, namespace, pod or VM name).
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [LR, LS, LRP, LSP, Chassis]
          description: Restrict results to one object type.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Maximum hits to return (max 200).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Number of hits to skip.
      responses:
        '200':
          description: Search hits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindResponse'
        '400':
          description: Missing or invalid query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Daemon not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /history/events:
    get:
      summary: Topology change feed
      description: >-
        Human-readable changes derived from recorded OVSDB row changes (M8,
        ADR-0002), newest first. Gaps appear as `gap.start` / `gap.end` events;
        unmapped row changes appear as generic `row.*` events.
      operationId: getHistoryEvents
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
          description: Oldest time to include (RFC3339 or a negative duration such as `-1h`).
        - name: until
          in: query
          required: false
          schema:
            type: string
          description: Newest time to include (RFC3339 or a negative duration).
        - name: kind
          in: query
          required: false
          schema:
            type: string
          description: Event kind, exact (`port.bound`) or a prefix up to a dot (`port`).
        - name: object
          in: query
          required: false
          schema:
            type: string
          description: Only events about this graph node ID.
        - name: before
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Only events with seq lower than this (the previous page's nextBefore).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
          description: Maximum events to return (max 1000).
      responses:
        '200':
          description: Events, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryEventList'
        '400':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: History is disabled on this daemon (HISTORY_DISABLED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /history/coverage:
    get:
      summary: History coverage
      description: Retention window, gaps, mode and store size of the topology history.
      operationId: getHistoryCoverage
      responses:
        '200':
          description: Coverage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryCoverage'
        '501':
          description: History is disabled on this daemon (HISTORY_DISABLED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /diff:
    get:
      summary: Topology diff
      description: >-
        Nodes and edges of a view added, removed or changed between two points,
        with field-level changes. Both graphs are reconstructed with the current
        graph code.
      operationId: getDiff
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
          description: Older point (same forms as `at` on /graph).
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: Newer point (default now).
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum: [l3, l2, chassis]
            default: l3
        - name: focus
          in: query
          required: false
          schema:
            type: string
          description: Focus node ID (required for view=l2, an ls:<uuid>).
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: The diff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphDiff'
        '400':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The point is outside history coverage (OUT_OF_COVERAGE) or in a gap (IN_GAP).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: History is disabled on this daemon (HISTORY_DISABLED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /events:
    get:
      summary: SSE event stream
      description: Server-Sent Events stream delivering graph revision changes and affected node IDs.
      operationId: getEvents
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/GraphEvent'

  /healthz:
    get:
      summary: Health check
      description: Returns 200 if daemon process is healthy.
      operationId: getHealthz
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /readyz:
    get:
      summary: Readiness check
      description: Returns 200 only after initial NB and SB snapshots have been synchronized into the graph.
      operationId: getReadyz
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /version:
    get:
      summary: Version info
      description: Returns daemon version, API version, and OVN schema versions.
      operationId: getVersion
      responses:
        '200':
          description: Version information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'

components:
  schemas:
    GraphResponse:
      type: object
      required:
        - revision
        - view
        - nodes
        - edges
      properties:
        revision:
          type: integer
          description: Monotonically increasing graph revision.
        view:
          type: string
          enum: [l3, l2, chassis]
          description: View type of the returned graph.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'

    GraphNode:
      type: object
      required:
        - id
        - type
        - name
      properties:
        id:
          type: string
          description: Typed node ID (e.g. lr:<uuid>, ls:<uuid>, lsp:<uuid>, ext:<name>).
        type:
          type: string
          enum: [LR, LS, LRP, LSP, Chassis, NAT, Route, Policy, LB, HAChassisGroup, External, VPC]
          description: Node type.
        name:
          type: string
          description: Name of the node object.
        parent:
          type: string
          description: Optional parent node ID for compound/nested node layout.
        properties:
          type: object
          additionalProperties: true
          description: Aggregated or specific node properties (e.g. port counts, IP/MAC, active chassis).
        k8s:
          $ref: '#/components/schemas/K8sMetadata'

    GraphEdge:
      type: object
      required:
        - id
        - source
        - target
        - type
      properties:
        id:
          type: string
          description: Edge identifier.
        source:
          type: string
          description: Source node ID.
        target:
          type: string
          description: Target node ID.
        type:
          type: string
          enum: [contains, router-peer, bound-on, gateway, nat-target, localnet]
          description: Edge relationship type.
        label:
          type: string
          description: Optional human-readable label (e.g. LRP IP prefix / network).
        properties:
          type: object
          additionalProperties: true
          description: Edge properties (e.g. priority, active status).

    PaginationInfo:
      type: object
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    K8sMetadata:
      type: object
      properties:
        namespace:
          type: string
        pod:
          type: string
        node:
          type: string
        subnet:
          type: string
        vpc:
          type: string
        vendor:
          type: string
          description: Value of vendor tag (e.g. kube-ovn).
        workloadKind:
          type: string
          description: Kind of workload (Pod, VirtualMachine, Deployment, DaemonSet, StatefulSet).
        workloadName:
          type: string
          description: Name of the owner workload or VM.
        owner:
          type: string
          description: Top-level owner reference (e.g. Deployment/coredns).
        vmi:
          type: string
          description: VirtualMachineInstance name for KubeVirt VMs.
        networkAttachment:
          type: string
          description: NetworkAttachmentDefinition name for multi-NIC interfaces.

    NodeDetail:
      type: object
      required:
        - id
        - type
        - name
        - raw
        - externalIds
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        raw:
          type: object
          additionalProperties: true
          description: Raw columns from OVSDB.
        externalIds:
          type: object
          additionalProperties:
            type: string
        k8s:
          $ref: '#/components/schemas/K8sMetadata'
        related:
          type: array
          items:
            $ref: '#/components/schemas/RelatedObject'
        staticRoutes:
          type: array
          items:
            $ref: '#/components/schemas/StaticRoute'
          description: Static routes configured on this LR, ordered by longest prefix match.
        policies:
          type: array
          items:
            $ref: '#/components/schemas/RouterPolicy'
          description: Routing policies configured on this LR, ordered by priority descending.
        nats:
          type: array
          items:
            $ref: '#/components/schemas/NatRule'
          description: NAT rules configured on this LR, ordered by type then external IP.
        revision:
          type: integer
          description: Graph revision the detail was read from.

    FindResponse:
      type: object
      required:
        - revision
        - total
        - items
      properties:
        revision:
          type: integer
          description: Graph revision the search ran against.
        total:
          type: integer
          description: Total number of hits before limit/offset.
        items:
          type: array
          items:
            $ref: '#/components/schemas/FindHit'

    FindHit:
      type: object
      required:
        - id
        - type
        - name
        - matchedField
        - exact
      properties:
        id:
          type: string
          description: Typed node ID, usable with /node/{id} and as a graph focus.
        type:
          type: string
          enum: [LR, LS, LRP, LSP, Chassis]
        name:
          type: string
        matchedField:
          type: string
          enum: [name, ip, mac, namespace, pod, vm, hostname, encap-ip, node]
          description: Which field matched the query.
        exact:
          type: boolean
          description: True when the matched field equals the query exactly.
        parent:
          type: string
          description: ID of the containing LS (for an LSP) or LR (for an LRP).
        k8s:
          $ref: '#/components/schemas/K8sMetadata'

    RelatedObject:
      type: object
      required:
        - id
        - type
        - relationship
      properties:
        id:
          type: string
        type:
          type: string
        relationship:
          type: string
        name:
          type: string

    StaticRoute:
      type: object
      required:
        - ipPrefix
        - nexthop
      properties:
        id:
          type: string
          description: OVSDB UUID.
        ipPrefix:
          type: string
        nexthop:
          type: string
        outputPort:
          type: string
        policy:
          type: string
          enum: [dst-ip, src-ip]
        routeTable:
          type: string
        bfd:
          type: string
        ecmp:
          type: boolean
          description: True when multiple routes share the same (routeTable, policy, ipPrefix).

    RouterPolicy:
      type: object
      required:
        - priority
        - match
        - action
      properties:
        id:
          type: string
          description: OVSDB UUID.
        priority:
          type: integer
        match:
          type: string
        action:
          type: string
          enum: [allow, drop, reroute]
        nexthops:
          type: array
          items:
            type: string

    NatRule:
      type: object
      required:
        - type
        - externalIp
        - logicalIp
      properties:
        id:
          type: string
          description: OVSDB UUID.
        type:
          type: string
          enum: [dnat, snat, dnat_and_snat]
        externalIp:
          type: string
        logicalIp:
          type: string
        logicalPort:
          type: string
        externalMac:
          type: string
        gatewayPort:
          type: string

    ChassisList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChassisDetail'
        revision:
          type: integer
          description: Graph revision the list was read from.

    ChassisDetail:
      type: object
      required:
        - name
        - hostname
        - encaps
        - bindingCount
        - gatewayRoles
        - haGroups
      properties:
        name:
          type: string
          description: Chassis UUID or name.
        hostname:
          type: string
        nodeName:
          type: string
        encaps:
          type: array
          items:
            $ref: '#/components/schemas/EncapDetail'
        bindingCount:
          type: integer
        boundPorts:
          type: array
          items:
            type: string
        gatewayRoles:
          type: array
          items:
            $ref: '#/components/schemas/GatewayRole'
        haGroups:
          type: array
          items:
            $ref: '#/components/schemas/HAGroupRole'
        otherConfig:
          type: object
          additionalProperties:
            type: string
        externalIds:
          type: object
          additionalProperties:
            type: string

    EncapDetail:
      type: object
      required:
        - type
        - ip
      properties:
        type:
          type: string
        ip:
          type: string
        options:
          type: object
          additionalProperties:
            type: string

    GatewayRole:
      type: object
      required:
        - lrpName
        - routerName
        - priority
        - active
      properties:
        lrpName:
          type: string
        routerName:
          type: string
        priority:
          type: integer
        active:
          type: boolean

    HAGroupRole:
      type: object
      required:
        - groupName
        - priority
      properties:
        groupName:
          type: string
        priority:
          type: integer

    GraphEvent:
      type: object
      required:
        - revision
        - changed
      properties:
        revision:
          type: integer
        changed:
          type: array
          items:
            type: string

    HistoryPoint:
      type: object
      required: [epoch, revision, time]
      properties:
        epoch:
          type: string
          description: History epoch (one per daemon start in memory mode).
        revision:
          type: integer
          format: int64
        time:
          type: string
          format: date-time

    HistoryEvent:
      type: object
      required: [seq, revision, time, kind, summary]
      properties:
        seq:
          type: integer
          format: int64
          description: Monotonic event number; pagination cursor.
        revision:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        kind:
          type: string
          description: >-
            e.g. lsp.added, port.bound, port.moved, gateway.failover, nat.retargeted,
            route.removed, chassis.added, lb.backends, gap.start, gap.end, row.modify.
        object:
          type: string
          description: Graph node ID the event is about.
        name:
          type: string
        summary:
          type: string
        coalesced:
          type: boolean
          description: Derived from a resync after a gap; may merge several changes.

    HistoryEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEvent'
        nextBefore:
          type: integer
          format: int64
          description: Pass as `before` for the next (older) page; absent on the last page.

    HistoryGap:
      type: object
      required: [start, revision, reason]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          description: Absent while the gap is open.
        revision:
          type: integer
          format: int64
          description: Last revision before the gap.
        reason:
          type: string

    HistoryCoverage:
      type: object
      required: [mode, epoch, records, events, checkpoints, bytes, gaps, limits]
      properties:
        mode:
          type: string
          enum: [memory, persistent]
        epoch:
          type: string
        oldest:
          $ref: '#/components/schemas/HistoryPoint'
        newest:
          $ref: '#/components/schemas/HistoryPoint'
        records:
          type: integer
        events:
          type: integer
        checkpoints:
          type: integer
        bytes:
          type: integer
          format: int64
          description: Estimated retained size.
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/HistoryGap'
        limits:
          type: object
          required: [maxRecords, maxBytes, maxAgeSeconds]
          properties:
            maxRecords:
              type: integer
            maxBytes:
              type: integer
              format: int64
            maxAgeSeconds:
              type: integer
              format: int64

    FieldChange:
      type: object
      required: [field]
      properties:
        field:
          type: string
          description: Dotted path (name, parent, properties.activeGateway, k8s.namespace…).
        from:
          type: string
          description: Old value rendered as JSON; absent if the field was not set.
        to:
          type: string
          description: New value rendered as JSON; absent if the field is no longer set.

    NodeChange:
      type: object
      required: [id, type, name, fields]
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'

    EdgeChange:
      type: object
      required: [id, source, target, type, fields]
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        type:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'

    GraphDiff:
      type: object
      required: [from, to, view, addedNodes, removedNodes, changedNodes, addedEdges, removedEdges, changedEdges]
      properties:
        from:
          $ref: '#/components/schemas/HistoryPoint'
        to:
          $ref: '#/components/schemas/HistoryPoint'
        view:
          type: string
          enum: [l3, l2, chassis]
        addedNodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        removedNodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        changedNodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeChange'

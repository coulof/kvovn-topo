[tools]
go = "1.27"
golangci-lint = "2.15.0"

[env]
KUBECONFIG = "{{env.KUBECONFIG | default(value=env.HOME ~ '/.kube/hv-01.yaml')}}"
RANCHER_API = "https://10.144.98.13.sslip.io/"
NB_PORT = "6641"
SB_PORT = "6642"
DAEMON_PORT = "8888"
DAEMON_URL = "http://127.0.0.1:8888/api/v1"
PROXY_POD = "ovn-topology-proxy"
PROXY_NAMESPACE = "kube-system"
# Image of the dev relay pod (any image with python3); match your Kube-OVN
# version or point at your mirror (air-gap).
PROXY_IMAGE = "{{env.PROXY_IMAGE | default(value='docker.io/kubeovn/kube-ovn:v1.16.2')}}"
# The in-cluster daemon through the Kubernetes service proxy (authn + RBAC by
# the API server); used by the api-* and test-live tasks. No port-forward.
OVN_TOPO_API = "/api/v1/namespaces/kube-system/services/http:ovn-topologyd:http/proxy/api/v1"

[tasks.build]
description = "Build ovn-topologyd and ovn-topo binaries"
run = "make build"

# Dev only. A locally run daemon must reach the OVN databases, but a plain
# `kubectl port-forward svc/ovn-nb` cannot: the ovn-central pods are
# hostNetwork and NB/SB listen on the node IP, while port-forward always dials
# localhost inside the pod (ROADMAP Q3). This pod relays 6641/6642 from its own
# network to the ovn-nb/ovn-sb Services, and `pf` port-forwards to it.
# It is the only thing any task creates in the cluster: remove it with
# `mise run pf-proxy-remove`. The in-cluster daemon, the TUI and MCP never need it.
[tasks.pf-proxy-deploy]
description = "[dev] Create the ovn-topology-proxy relay pod in kube-system (OVSDB reach for a locally run daemon)"
run = """
if ! kubectl --kubeconfig "$KUBECONFIG" get pod -n "$PROXY_NAMESPACE" "$PROXY_POD" > /dev/null 2>&1; then
  echo "Deploying $PROXY_POD ($PROXY_IMAGE) in $PROXY_NAMESPACE; remove it with: mise run pf-proxy-remove"
  sed "s|__PROXY_IMAGE__|$PROXY_IMAGE|" << 'EOF' | kubectl --kubeconfig "$KUBECONFIG" apply -f -
apiVersion: v1
kind: Pod
metadata:
  name: ovn-topology-proxy
  namespace: kube-system
  labels:
    app: ovn-topology-proxy
spec:
  containers:
    - name: proxy
      image: __PROXY_IMAGE__
      imagePullPolicy: IfNotPresent
      command:
        - python3
        - -c
        - |
          import asyncio

          async def pipe(reader, writer):
              try:
                  while True:
                      data = await reader.read(65536)
                      if not data:
                          break
                      writer.write(data)
                      await writer.drain()
              except Exception:
                  pass
              finally:
                  writer.close()

          async def handle_nb(reader, writer):
              r, w = await asyncio.open_connection("ovn-nb.kube-system.svc.cluster.local", 6641)
              asyncio.create_task(pipe(reader, w))
              asyncio.create_task(pipe(r, writer))

          async def handle_sb(reader, writer):
              r, w = await asyncio.open_connection("ovn-sb.kube-system.svc.cluster.local", 6642)
              asyncio.create_task(pipe(reader, w))
              asyncio.create_task(pipe(r, writer))

          async def main():
              s1 = await asyncio.start_server(handle_nb, "0.0.0.0", 6641)
              s2 = await asyncio.start_server(handle_sb, "0.0.0.0", 6642)
              async with s1, s2:
                  await asyncio.gather(s1.serve_forever(), s2.serve_forever())

          asyncio.run(main())
      ports:
        - containerPort: 6641
        - containerPort: 6642
EOF
  kubectl --kubeconfig "$KUBECONFIG" wait --for=condition=Ready pod/"$PROXY_POD" -n "$PROXY_NAMESPACE" --timeout=30s
fi
"""

[tasks.pf-proxy-remove]
description = "[dev] Stop the OVN port-forwards and delete the ovn-topology-proxy relay pod"
depends = ["pf-stop"]
run = "kubectl --kubeconfig \"$KUBECONFIG\" delete pod -n \"$PROXY_NAMESPACE\" \"$PROXY_POD\" --ignore-not-found"

[tasks.pf]
alias = "port-forward"
description = "[dev] Port-forward ovn-nb/ovn-sb to localhost, for a locally run daemon or mcp-embedded"
depends = ["pf-proxy-deploy"]
run = """
pkill -f "kubectl.*port-forward.*$PROXY_POD" || true
pkill -f "kubectl.*port-forward.*6641" || true
pkill -f "kubectl.*port-forward.*6642" || true
echo "Starting background port-forward to $PROXY_POD..."
nohup kubectl --kubeconfig "$KUBECONFIG" port-forward -n "$PROXY_NAMESPACE" pod/"$PROXY_POD" "$NB_PORT":6641 "$SB_PORT":6642 > /tmp/ovn-pf.log 2>&1 &
sleep 2
echo "Port-forward active on 127.0.0.1:$NB_PORT (NB) and 127.0.0.1:$SB_PORT (SB)"
"""

[tasks.pf-stop]
alias = "port-forward-stop"
description = "[dev] Stop the OVN port-forwards"
run = """
pkill -f "kubectl.*port-forward.*$PROXY_POD" || true
pkill -f "kubectl.*port-forward.*6641" || true
pkill -f "kubectl.*port-forward.*6642" || true
echo "Port-forwards stopped."
"""

[tasks.daemon]
description = "[dev] Run ovn-topologyd locally against the cluster OVN databases (needs mise run pf)"
depends = ["build"]
run = """
./bin/ovn-topologyd \
  --kubeconfig="$KUBECONFIG" \
  --nb-endpoints="tcp:127.0.0.1:$NB_PORT" \
  --sb-endpoints="tcp:127.0.0.1:$SB_PORT" \
  --listen-addr=":$DAEMON_PORT" \
  --log-level=info
"""

[tasks.tui]
description = "Launch the TUI against the in-cluster daemon through the Kubernetes service proxy (no port-forward)"
depends = ["build"]
run = """
DIAG_FLAG=""
if [ "${DIAG:-false}" = "true" ] || [ "${DIAG:-0}" = "1" ]; then
  DIAG_FLAG="--diag"
fi
./bin/ovn-topo --kubeconfig="$KUBECONFIG" $DIAG_FLAG
"""

[tasks.tui-diag]
description = "Launch interactive TUI with Tier 1 exec-based diagnostics enabled (--diag)"
depends = ["build"]
run = "DIAG=true mise run tui"

[tasks.tui-local]
description = "[dev] Launch the TUI against the locally running daemon (mise run daemon)"
depends = ["build"]
run = "./bin/ovn-topo --daemon-url=$DAEMON_URL"

[tasks.tui-offline]
description = "Launch TUI in offline mode using bundled dev fixtures"
depends = ["build"]
run = "./bin/ovn-topo --fixture"

[tasks.api-ready]
alias = "curl-ready"
description = "Check the in-cluster daemon's readiness through the service proxy"
run = "kubectl --kubeconfig \"$KUBECONFIG\" get --raw \"$OVN_TOPO_API/readyz\" | jq ."

[tasks.api-version]
alias = "curl-version"
description = "Query the in-cluster daemon and OVN schema versions through the service proxy"
run = "kubectl --kubeconfig \"$KUBECONFIG\" get --raw \"$OVN_TOPO_API/version\" | jq ."

[tasks.api-graph]
alias = "curl-graph"
description = "Fetch the aggregated L3 graph through the service proxy"
run = "kubectl --kubeconfig \"$KUBECONFIG\" get --raw \"$OVN_TOPO_API/graph?view=l3\" | jq ."

[tasks.api-chassis]
alias = "curl-chassis"
description = "Fetch the chassis list through the service proxy"
run = "kubectl --kubeconfig \"$KUBECONFIG\" get --raw \"$OVN_TOPO_API/chassis\" | jq ."

[tasks.api-find]
description = "Search objects through the service proxy: mise run api-find <text>"
usage = 'arg "[q]" help="name, IP, MAC, namespace, pod or VM" default="join"'
run = """
q="${usage_q:-join}"
kubectl --kubeconfig "$KUBECONFIG" get --raw "$OVN_TOPO_API/find?q=$(jq -rn --arg q "$q" '$q|@uri')" | jq .
"""

[tasks.api-events]
alias = "curl-events"
description = "Stream live SSE events from the in-cluster daemon (local kubectl proxy, authenticated by the kubeconfig)"
run = """
LOG=$(mktemp)
kubectl --kubeconfig "$KUBECONFIG" proxy --port=0 > "$LOG" 2>&1 &
KP=$!
trap 'kill $KP 2>/dev/null || true; rm -f "$LOG"' EXIT INT TERM
for _ in $(seq 1 50); do grep -q "Starting to serve" "$LOG" && break; sleep 0.1; done
ADDR=$(sed -n 's/^Starting to serve on //p' "$LOG")
[ -n "$ADDR" ] || { cat "$LOG" >&2; exit 1; }
curl -N -s "http://$ADDR$OVN_TOPO_API/events"
"""

[tasks.test-live]
description = "End-to-end check of the in-cluster daemon through the Kubernetes service proxy (no port-forward)"
run = """
set -euo pipefail
api() { kubectl --kubeconfig "$KUBECONFIG" get --raw "$OVN_TOPO_API$1"; }
echo "==> Checking /readyz..."
api /readyz | jq .
echo "==> Checking /version..."
api /version | jq .
echo "==> Checking /graph?view=l3..."
api "/graph?view=l3" | jq '{revision: .revision, nodes: (.nodes | length), edges: (.edges | length), vpcs: [.nodes[] | select(.type=="VPC") | .name]}'
echo "==> Checking /chassis..."
api /chassis | jq '{total_chassis: (.items | length), hostnames: [.items[].hostname]}'
echo "==> Checking /find?q=join..."
api "/find?q=join" | jq '{total, first: .items[0].id}'
echo "==> All live tests passed!"
"""

[tasks.test-local]
description = "[dev] Same checks against the locally running daemon (mise run daemon)"
run = """
set -euo pipefail
echo "==> Checking /readyz..."
curl -fsS "$DAEMON_URL/readyz" | jq .
echo "==> Checking /graph?view=l3..."
curl -fsS "$DAEMON_URL/graph?view=l3" | jq '{revision: .revision, nodes: (.nodes | length), edges: (.edges | length)}'
echo "==> Checking /chassis..."
curl -fsS "$DAEMON_URL/chassis" | jq '{total_chassis: (.items | length)}'
echo "==> All local tests passed!"
"""

[tasks.install]
description = "Install ovn-topo into ~/.local/bin (for MCP clients that run `ovn-topo mcp`)"
depends = ["build"]
run = "install -D -m 0755 bin/ovn-topo \"$HOME/.local/bin/ovn-topo\" && echo \"installed $HOME/.local/bin/ovn-topo\""

[tasks.mcp-offline]
description = "Smoke-test ovn-topo mcp against the hv-01-lab fixture (no cluster)"
depends = ["build"]
run = "hack/mcp-smoke.sh --fixture-dir testdata/scenarios/hv-01-lab"

[tasks.mcp-live]
description = "Smoke-test ovn-topo mcp against the in-cluster daemon through the Kubernetes service proxy (no port-forward)"
depends = ["build"]
run = "hack/mcp-smoke.sh --kubeconfig \"$KUBECONFIG\""

[tasks.mcp-local]
description = "[dev] Smoke-test ovn-topo mcp against the locally running daemon (mise run daemon)"
depends = ["build"]
run = "hack/mcp-smoke.sh --daemon-url \"$DAEMON_URL\""

[tasks.mcp-embedded]
description = "[dev] Smoke-test ovn-topo mcp with the embedded graph over the OVN port-forwards"
depends = ["build", "pf"]
run = "hack/mcp-smoke.sh --kubeconfig \"$KUBECONFIG\" --nb \"tcp:127.0.0.1:$NB_PORT\" --sb \"tcp:127.0.0.1:$SB_PORT\""

[tasks.clean]
description = "Stop port-forwards and clean build artifacts"
depends = ["pf-stop"]
run = "rm -rf bin/"

[tasks.deploy-cluster]
description = "Deploy or upgrade ovn-topology daemon Helm chart in cluster with latest tag and Always pull"
run = """
helm upgrade --install ovn-topology ./charts/ovn-topology \
  --kubeconfig "$KUBECONFIG" \
  --namespace kube-system \
  --set image.tag="latest" \
  --set image.pullPolicy="Always"
"""

[tasks.undeploy-cluster]
description = "Uninstall ovn-topology daemon Helm chart from cluster"
run = "helm uninstall ovn-topology --kubeconfig \"$KUBECONFIG\" --namespace kube-system --ignore-not-found"



